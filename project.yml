# XcodeGen spec.
#
# `Roamed.xcodeproj` is checked in and is what Xcode opens, so this file is not needed to build.
# It is here as the readable source of truth for what that project contains: if the checked-in
# project is ever damaged, `xcodegen generate` rebuilds an equivalent one from this.
name: Roamed
options:
  bundleIdPrefix: dev.jackque
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RoamedCore:
    path: Core

targets:
  Roamed:
    type: application
    platform: iOS
    sources:
      - path: Roamed
        excludes:
          - Info.plist
    dependencies:
      - package: RoamedCore
        product: RoamedCore
    info:
      path: Roamed/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jackque.roamed
        INFOPLIST_FILE: Roamed/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
